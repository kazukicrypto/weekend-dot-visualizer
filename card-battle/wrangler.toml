name = "card-battle"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

# 無料プランでも使える SQLite バックエンドの Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Matchmaker"]
