<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0510" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ドラゴン・ブレイズ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #0a0510; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    color: #fff; display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  #wrap { position: relative; width: 100vw; height: 100dvh; max-width: 520px; margin: 0 auto; overflow: hidden; background: #0a0510; }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 12px) 14px 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .hud-l { font-size: 12px; opacity: .95; }
  .lvl { font-weight: 800; font-size: 13px; color: #ffb86a; letter-spacing: .5px; }
  .xpbar { width: 128px; height: 7px; border-radius: 6px; margin: 4px 0; background: rgba(255,255,255,.14); overflow: hidden; }
  .xpbar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#ffcf5a,#ff6a3d); transition: width .18s ease; }
  .hud-l .sc { font-size: 12px; opacity: .8; }
  .hud-l .sc b { font-size: 20px; font-weight: 800; margin-left: 3px; }
  .hud-r { text-align: right; font-size: 12px; opacity: .95; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #lives { font-size: 17px; letter-spacing: 1px; }
  #muteBtn, #pauseBtn { pointer-events: auto; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
             color: #fff; width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  #muteBtn:active, #pauseBtn:active { transform: scale(.92); }

  /* Overlays */
  .overlay {
    position: absolute; inset: 0; z-index: 5; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px 24px; gap: 14px;
    background: radial-gradient(circle at 50% 30%, rgba(60,20,30,.78), rgba(10,5,16,.96));
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: clamp(28px, 8.5vw, 44px); font-weight: 900; line-height: 1.05;
    background: linear-gradient(180deg, #ffd27a, #ff5a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255,90,60,.5));
  }
  .tag-badge { font-size: 11px; letter-spacing: 3px; opacity: .6; text-transform: uppercase; }
  .tagline { font-size: 14px; opacity: .82; margin-top: -4px; }
  .hint { font-size: 12.5px; opacity: .72; line-height: 1.7; max-width: 320px; }
  .hint b { color: #ffb86a; font-weight: 700; }
  .coins { font-size: 15px; font-weight: 800; color: #ffd76a; }

  .btn {
    pointer-events: auto; border: none; cursor: pointer;
    padding: 15px 44px; border-radius: 999px; font-size: 19px; font-weight: 800; color: #2a0a06;
    background: linear-gradient(180deg, #ffd27a, #ff7a3d);
    box-shadow: 0 8px 26px rgba(255,110,60,.45), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .1s ease;
  }
  .btn:active { transform: scale(.95); }
  .menu { display: flex; flex-direction: column; gap: 11px; width: 100%; max-width: 300px; }
  .mbtn {
    pointer-events: auto; cursor: pointer; border: 1.5px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: #fff; border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 700; transition: all .14s ease;
  }
  .mbtn:active { transform: scale(.97); }
  .mbtn small { display: block; font-weight: 400; font-size: 11px; opacity: .6; margin-top: 2px; }
  .equipped { font-size: 12px; opacity: .7; line-height: 1.6; }
  .equipped b { color: #ffcf5a; font-weight: 700; }
  .best { font-size: 13px; opacity: .72; }
  .big-score { font-size: 15px; opacity: .9; }
  .big-score b { font-size: 38px; display: block; font-weight: 900; color: #ffd76a; }

  /* Level up cards */
  #levelup .lu-title { font-size: 24px; font-weight: 900; color: #ffe08a; filter: drop-shadow(0 2px 10px rgba(255,200,80,.4)); }
  #levelup .lu-sub { font-size: 12px; opacity: .7; margin-top: -6px; }
  .cards { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; margin-top: 4px; }
  .card {
    pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left;
    border: 1.5px solid rgba(255,255,255,.16); border-radius: 16px; padding: 14px 16px; background: rgba(255,255,255,.06);
    transition: transform .12s ease, background .2s ease;
  }
  .card:active { transform: scale(.97); }
  .card .ic { font-size: 30px; line-height: 1; width: 40px; text-align: center; }
  .card .tx h3 { font-size: 16px; font-weight: 800; }
  .card .tx p { font-size: 12px; opacity: .72; margin-top: 2px; line-height: 1.4; }
  .card[data-rare="1"] { border-color: rgba(255,215,120,.5); background: rgba(255,200,80,.09); }
  .card[data-rare="1"] .tx h3 { color: #ffe08a; }
  @keyframes pop { 0%{transform:scale(.8);opacity:0} 100%{transform:scale(1);opacity:1} }
  #levelup .cards .card { animation: pop .18s ease backwards; }
  #levelup .cards .card:nth-child(2){ animation-delay:.05s } #levelup .cards .card:nth-child(3){ animation-delay:.1s }

  /* Gacha / Equip */
  .sec-title { font-size: 12px; letter-spacing: 2px; opacity: .55; margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; width: 100%; max-width: 340px; }
  .chip {
    pointer-events: auto; cursor: pointer; border: 2px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.05); border-radius: 13px; padding: 10px 8px; text-align: center; transition: all .14s ease;
  }
  .chip:active { transform: scale(.96); }
  .chip .ci { font-size: 26px; line-height: 1; }
  .chip .cn { font-size: 12px; font-weight: 700; margin-top: 3px; }
  .chip .cr { font-size: 9.5px; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; opacity: .9; }
  .chip.eq { box-shadow: 0 0 0 2px #ffcf5a inset; border-color: #ffcf5a; }
  .chip.locked { opacity: .3; }
  .gbtns { display: flex; gap: 10px; }
  .gbtn {
    pointer-events: auto; cursor: pointer; border: none; border-radius: 14px; padding: 13px 20px;
    font-size: 15px; font-weight: 800; color: #2a0a06; background: linear-gradient(180deg,#ffd27a,#ff9a3d);
    box-shadow: 0 6px 18px rgba(255,120,60,.4);
  }
  .gbtn:active { transform: scale(.95); }
  .gbtn.dis { opacity: .4; pointer-events: none; }
  .gresult { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; width: 100%; max-width: 340px; min-height: 10px; }
  .gcell { border: 1.5px solid rgba(255,255,255,.18); border-radius: 10px; padding: 7px 2px; text-align: center; animation: pop .2s ease backwards; }
  .gcell .gi { font-size: 20px; } .gcell .gn { font-size: 9px; margin-top: 2px; opacity: .85; line-height: 1.1; }
  .link { pointer-events: auto; cursor: pointer; font-size: 14px; opacity: .7; text-decoration: underline; padding: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" style="display:none">
    <div class="hud-l">
      <div class="lvl">Lv <span id="level">1</span></div>
      <div class="xpbar"><i id="xpfill"></i></div>
      <div class="sc">SCORE<b id="score">0</b></div>
    </div>
    <div class="hud-r">
      <div>WAVE <span id="wave">1</span></div>
      <div id="lives">❤️❤️❤️</div>
      <div style="display:flex; gap:6px;">
        <button id="pauseBtn">⏸</button>
        <button id="muteBtn">🔊</button>
      </div>
    </div>
  </div>

  <!-- Title / Menu -->
  <div class="overlay" id="startScreen">
    <div class="tag-badge">DRAGON SHOOTER</div>
    <div class="title">ドラゴン・<br>ブレイズ</div>
    <div class="tagline">竜を駆り、炎を吐き、進むほど激しく。</div>
    <div class="coins">🪙 <span id="coinsT">0</span></div>
    <div class="menu">
      <button class="btn" id="startBtn" style="width:100%">▶ スタート</button>
      <button class="mbtn" id="gachaOpenBtn">🎁 ドラゴンガチャ<small>ミニドラゴンや武器が出る</small></button>
      <button class="mbtn" id="equipOpenBtn">🐉 そうび<small>武器とお供を変更</small></button>
    </div>
    <div class="equipped" id="equipSummary"></div>
    <div class="best" id="startBest"></div>
    <div class="menu" style="margin-top:6px">
      <div class="tag-badge">ほかのゲーム</div>
      <a class="mbtn" href="../tower/" style="text-decoration:none; display:block">🎲 ダイス・ディフェンス<small>ランダムダイス風タワーディフェンス</small></a>
      <a class="mbtn" href="../" style="text-decoration:none; display:block">🎮 ゲーム一覧へ</a>
    </div>
  </div>

  <!-- Gacha -->
  <div class="overlay hidden" id="gachaScreen">
    <div class="tag-badge">GACHA</div>
    <div class="title" style="font-size:clamp(24px,7vw,36px)">ドラゴンガチャ</div>
    <div class="coins">🪙 <span id="coinsG">0</span></div>
    <div class="gbtns">
      <button class="gbtn" id="pull1">単発<br>🪙100</button>
      <button class="gbtn" id="pull10">10連<br>🪙900</button>
    </div>
    <div class="gresult" id="gachaResult"></div>
    <div class="hint" style="max-width:300px" id="gachaMsg">レア以上でミニドラゴンや強力な武器をゲット！</div>
    <div class="link" id="gachaBack">← もどる</div>
  </div>

  <!-- Equipment -->
  <div class="overlay hidden" id="equipScreen">
    <div class="tag-badge">EQUIP</div>
    <div class="title" style="font-size:clamp(24px,7vw,36px)">そうび</div>
    <div class="sec-title">武器（ブレス）</div>
    <div class="grid2" id="weaponList"></div>
    <div class="sec-title">お供ドラゴン</div>
    <div class="grid2" id="dragonList"></div>
    <div class="link" id="equipBack">← もどる</div>
  </div>

  <!-- Level Up -->
  <div class="overlay hidden" id="levelup">
    <div class="lu-title">⭐ LEVEL UP!</div>
    <div class="lu-sub">スキルを1つ選んで強化</div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- Pause -->
  <div class="overlay hidden" id="pauseScreen">
    <div class="tag-badge">PAUSED</div>
    <div class="title" style="font-size:clamp(26px,8vw,40px)">一時停止</div>
    <button class="btn" id="resumeBtn">▶ 再開</button>
    <button class="mbtn" id="quitBtn" style="max-width:220px">やめてタイトルへ</button>
  </div>

  <!-- Game Over -->
  <div class="overlay hidden" id="overScreen">
    <div class="tag-badge" id="overTag">GAME OVER</div>
    <div class="big-score">SCORE<b id="finalScore">0</b></div>
    <div class="coins" id="earnCoins"></div>
    <div class="best" id="overBest"></div>
    <button class="btn" id="retryBtn">↻ もう一度</button>
    <button class="mbtn" id="toTitleBtn" style="max-width:220px">タイトルへ</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const $ = id => document.getElementById(id);

  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = wrap.getBoundingClientRect(); W = r.width; H = r.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const vib = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ===================== AUDIO =====================
  const Audio = (() => {
    let actx = null, master = null, muted = false, noiseBuf = null, musicTimer = null, step = 0;
    function ensure() {
      if (actx) return;
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
      const len = actx.sampleRate * 0.5; noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    function tone(freq, dur, type, vol, slideTo) {
      if (!actx || muted) return;
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, vol, freq) {
      if (!actx || muted) return;
      const t = actx.currentTime, s = actx.createBufferSource(); s.buffer = noiseBuf;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq || 800; bp.Q.value = 0.8;
      const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t + dur);
    }
    const arp = [330, 392, 494, 587, 494, 392, 440, 523], bass = [98, 98, 73, 87];
    function musicTick() {
      if (!actx || muted || !window.__playing) return;
      tone(arp[step % arp.length], 0.13, 'triangle', 0.045, arp[step % arp.length]);
      if (step % 4 === 0) tone(bass[(step / 4) % bass.length | 0], 0.28, 'sawtooth', 0.06);
      step++;
    }
    function startMusic() { ensure(); if (!musicTimer && actx) musicTimer = setInterval(musicTick, 165); }
    return {
      resume() { ensure(); if (actx && actx.state === 'suspended') actx.resume(); startMusic(); },
      toggleMute() { muted = !muted; return muted; }, isMuted() { return muted; },
      shoot() { tone(360, 0.06, 'sawtooth', 0.03, 180); },
      hit() { noise(0.05, 0.09, 1300); },
      explode() { noise(0.34, 0.28, 460); tone(70, 0.36, 'sine', 0.22, 34); },
      hurt() { tone(220, 0.32, 'sawtooth', 0.24, 55); vib(60); },
      power() { tone(560, 0.09, 'square', 0.13, 900); setTimeout(() => tone(1100, 0.1, 'square', 0.1, 1300), 70); },
      coin() { tone(880, 0.06, 'square', 0.1, 1250); setTimeout(() => tone(1320, 0.08, 'square', 0.09, 1500), 60); },
      level() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'square', 0.12, f), i * 80)); vib(30); },
      select() { tone(680, 0.07, 'square', 0.12, 1050); },
      boss() { tone(60, 0.7, 'sawtooth', 0.28, 44); setTimeout(() => tone(46, 0.7, 'sawtooth', 0.24, 36), 120); vib([0, 80, 40, 80]); },
      gacha() { [392, 523, 659].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'triangle', 0.1, f), i * 60)); },
      legend() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'square', 0.13, f), i * 90)); vib([0, 40, 30, 40, 30, 80]); },
      over() { [392, 311, 233, 175].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.17, f * 0.7), i * 130)); }
    };
  })();

  // ===================== META (gacha / equip / save) =====================
  const RARITY = [
    { name: 'コモン', color: '#9aa4b2' }, { name: 'レア', color: '#5bc8ff' },
    { name: 'エピック', color: '#c07bff' }, { name: 'レジェンダリー', color: '#ffcf5a' }
  ];
  // Weapons (breath). rarity, fire profile.
  const WEAPONS = {
    normal:  { name: 'ノーマルブレス', rarity: 0, icon: '🔥', desc: '標準の炎弾', proj: 1, interval: 19, spread: 7, bulletR: 3.3, dmg: 0.5 },
    rapid:   { name: 'ラピッドブレス', rarity: 0, icon: '💨', desc: '速射・小炎弾', proj: 1, interval: 13, spread: 6, bulletR: 2.9, dmg: 0.36 },
    twin:    { name: 'ツインブレス', rarity: 1, icon: '🔥', desc: '2連の炎弾', proj: 2, interval: 19, spread: 9, bulletR: 3.3, dmg: 0.5 },
    spread:  { name: 'スプレッドブレス', rarity: 2, icon: '🌋', desc: '3方向へ拡散', proj: 3, interval: 20, spread: 13, bulletR: 3.3, dmg: 0.5 },
    inferno: { name: 'インフェルノ', rarity: 3, icon: '☄️', desc: '高速・特大の業火', proj: 1, interval: 12, spread: 6, bulletR: 5.8, dmg: 0.9 }
  };
  // Companion mini-dragons.
  const DRAGONS = {
    none:    { name: 'なし', rarity: 0, icon: '—', desc: 'お供なし' },
    fire:    { name: 'チビファイア', rarity: 0, icon: '🐲', color: '#ff7a3d', desc: 'ときどき炎を吐く', interval: 48, count: 1, dmg: 0.35 },
    ember:   { name: 'チビエンバー', rarity: 0, icon: '🦎', color: '#ff5a2d', desc: '小さな火の玉', interval: 44, count: 1, dmg: 0.4 },
    ice:     { name: 'チビアイス', rarity: 1, icon: '🐉', color: '#5bc8ff', desc: '速い連射', interval: 36, count: 1, dmg: 0.45 },
    shadow:  { name: 'チビシャドウ', rarity: 1, icon: '🦇', color: '#b06bff', desc: '闇の弾', interval: 34, count: 1, dmg: 0.5 },
    thunder: { name: 'チビサンダー', rarity: 2, icon: '🐲', color: '#ffd93d', desc: '2連射', interval: 40, count: 2, dmg: 0.45 },
    gold:    { name: 'ゴールドドラゴン', rarity: 3, icon: '🐉', color: '#ffcf5a', desc: '強力な連射', interval: 26, count: 2, dmg: 0.62 }
  };
  const GACHA = [
    { t: 'w', id: 'rapid' }, { t: 'd', id: 'fire' }, { t: 'd', id: 'ember' },
    { t: 'w', id: 'twin' }, { t: 'd', id: 'ice' }, { t: 'd', id: 'shadow' },
    { t: 'w', id: 'spread' }, { t: 'd', id: 'thunder' },
    { t: 'w', id: 'inferno' }, { t: 'd', id: 'gold' }
  ];
  const REFUND = [30, 80, 200, 500];
  const idata = it => it.t === 'w' ? WEAPONS[it.id] : DRAGONS[it.id];

  const SAVE_KEY = 'dragon_blaze_save_v1';
  let meta;
  function loadMeta() {
    let m = null;
    try { m = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
    if (!m || typeof m !== 'object') m = {};
    meta = {
      coins: m.coins ?? 300,
      weapons: Object.assign({ normal: true }, m.weapons || {}),
      dragons: Object.assign({ none: true, fire: true }, m.dragons || {}),
      equipWeapon: m.equipWeapon && WEAPONS[m.equipWeapon] ? m.equipWeapon : 'normal',
      equipDragon: m.equipDragon && DRAGONS[m.equipDragon] ? m.equipDragon : 'fire',
      best: m.best || 0
    };
  }
  function saveMeta() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) {} }
  loadMeta();

  // ===================== STATE =====================
  const STATE = { START: 0, PLAY: 1, LEVELUP: 2, OVER: 3, PAUSE: 4 };
  let state = STATE.START;
  window.__playing = false;

  // progressive difficulty from wave
  const hpScale = () => 1 + wave * 0.22;
  const spdScale = () => Math.min(2.5, 1 + wave * 0.05);
  const ebScale = () => Math.min(2.3, 1 + wave * 0.05);

  let player, stats, mates = [], bullets = [], enemies = [], ebullets = [], particles = [], stars = [], drops = [], booms = [], boss = null;
  let score, hp, maxHp, wave, tick = 0, spawnTimer, waveTimer, invuln, fireCD, shake = 0;
  let xp, xpNext, level, pendingLevels, enemyId, bossCount, floatMsg;

  let embers = [];
  function makeStars() {
    stars = []; const n = Math.round((W * H) / 5200);
    for (let i = 0; i < n; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: rand(.3, 1.4), s: rand(.6, 1.8), tw: rand(0, 6.28) });
    embers = []; const m = Math.round((W * H) / 26000);
    for (let i = 0; i < m; i++) embers.push({ x: rand(0, W), y: rand(0, H), vy: rand(.3, .9), r: rand(.8, 2.4), a: rand(.2, .7), dx: rand(-.3, .3) });
  }

  function reset() {
    player = { x: W / 2, y: H * 0.78, r: 16, tx: W / 2, ty: H * 0.78 };
    const w = WEAPONS[meta.equipWeapon] || WEAPONS.normal;
    stats = {
      damage: w.dmg, fireInterval: w.interval, projectiles: w.proj, spreadDeg: w.spread,
      side: false, rear: false, diagonal: false, pierce: 0, bounce: 0, critChance: 0.03, critMult: 2,
      bulletR: w.bulletR, bulletSpeed: 7.0, moveLerp: 0.30, explosive: 0, magnet: 46
    };
    mates = [];
    const d = DRAGONS[meta.equipDragon];
    if (d && meta.equipDragon !== 'none') for (let i = 0; i < 2; i++) mates.push({ side: i === 0 ? -1 : 1, shootCD: d.interval + i * 8, data: d });
    bullets = []; enemies = []; ebullets = []; particles = []; drops = []; booms = []; boss = null;
    score = 0; maxHp = 3; hp = 3; wave = 1; tick = 0;
    spawnTimer = 36; waveTimer = 0; invuln = 70; fireCD = 0; shake = 0;
    xp = 0; level = 1; xpNext = 20; pendingLevels = 0; enemyId = 1; bossCount = 0; floatMsg = null;
    makeStars(); updateHUD();
  }

  // ===================== INPUT =====================
  let dragging = false, offX = 0, offY = 0;
  function pointFromEvent(e) { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; }
  function onDown(e) { if (state !== STATE.PLAY) return; e.preventDefault(); const p = pointFromEvent(e); dragging = true; offX = clamp(player.x - p.x, -60, 60); offY = clamp(player.y - p.y, -90, 40); }
  function onMove(e) { if (!dragging || state !== STATE.PLAY) return; e.preventDefault(); const p = pointFromEvent(e); player.tx = p.x + offX; player.ty = p.y + offY; }
  function onUp() { dragging = false; }
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp); canvas.addEventListener('touchcancel', onUp);
  canvas.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);

  // ===================== HELPERS =====================
  function spawnParticles(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) { const a = rand(0, 6.283), s = rand(.4, 1) * spd; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(16, 38), max: 38, color, r: rand(1.5, 3.5) }); }
  }
  function hit(ax, ay, ar, bx, by, br) { const dx = ax - bx, dy = ay - by, rr = ar + br; return dx * dx + dy * dy < rr * rr; }
  function dropGem(x, y) { drops.push({ kind: 'gem', x, y, r: 9, vy: 1.4 }); }
  function dropHeart(x, y) { drops.push({ kind: 'heart', x, y, r: 11, vy: 1.2 }); }

  function spawnBullet(x, y, ang, opt) {
    const crit = Math.random() < stats.critChance;
    bullets.push({
      x, y, vx: Math.cos(ang) * stats.bulletSpeed, vy: Math.sin(ang) * stats.bulletSpeed,
      r: stats.bulletR, dmg: stats.damage * (crit ? stats.critMult : 1), crit,
      pierce: stats.pierce, bounce: stats.bounce, hitB: false, hit: null
    });
  }
  function fire() {
    const cx = player.x, cy = player.y - player.r, n = stats.projectiles, sp = stats.spreadDeg * Math.PI / 180;
    for (let i = 0; i < n; i++) spawnBullet(cx, cy, -Math.PI / 2 + (i - (n - 1) / 2) * sp);
    if (stats.side) { spawnBullet(cx, player.y, 0); spawnBullet(cx, player.y, Math.PI); }
    if (stats.rear) spawnBullet(cx, player.y + player.r, Math.PI / 2);
    if (stats.diagonal) [-2.356, -0.785, 0.785, 2.356].forEach(a => spawnBullet(cx, cy, a));
    Audio.shoot();
  }
  function mateFire(m) {
    const d = m.data;
    for (let k = 0; k < d.count; k++) {
      const ox = (d.count > 1 ? (k - (d.count - 1) / 2) * 7 : 0);
      bullets.push({ x: m.x + ox, y: m.y - 6, vx: 0, vy: -7, r: 3.6, dmg: d.dmg, crit: false, pierce: 0, bounce: 0, hitB: false, hit: null, col: d.color });
    }
  }

  // ===================== SPAWN =====================
  function spawnEnemy() {
    const x = rand(28, W - 28), r = Math.random(), hm = hpScale(), sm = spdScale();
    if (r < 0.16 && wave >= 2) {
      enemies.push({ id: enemyId++, x, y: -24, r: 15, hp: Math.ceil((2 + wave * .3) * hm), t: 'zig', vy: rand(.9, 1.4) * sm, amp: rand(30, 70), ph: rand(0, 6.28), baseX: x, shootCD: rand(50, 100), color: '#c07bff', score: 30, xp: 5 });
    } else if (r < 0.30) {
      enemies.push({ id: enemyId++, x, y: -24, r: 13, hp: Math.ceil(1 * hm), t: 'dive', vy: rand(2.6, 3.6) * sm, color: '#ff9f43', score: 15, xp: 3 });
    } else {
      enemies.push({ id: enemyId++, x, y: -24, r: 14, hp: Math.ceil((1 + wave * .2) * hm), t: 'bat', vy: rand(1.2, 1.9) * sm, color: '#8b6bff', score: 20, xp: 4, wing: rand(0, 6.28) });
    }
  }
  function spawnMinion(bx, by) { enemies.push({ id: enemyId++, x: bx, y: by, r: 12, hp: Math.ceil(1 * hpScale()), t: 'dive', vy: rand(2.2, 3) * spdScale(), color: '#ff6a3d', score: 12, xp: 2 }); }
  function enemyShoot(x, y, tx, ty, spd) { const a = Math.atan2(ty - y, tx - x); ebullets.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 5 }); }

  const BOSS_NAMES = ['炎竜アグニ', '双炎竜バイス', '魔竜デスファング'];
  const BOSS_COLORS = ['#ff5470', '#b06bff', '#ff8a3d'];
  // each boss cycles through several distinct attack patterns for variety
  const BOSS_PATTERNS = [
    [{ n: 'aimed3', dur: 190 }, { n: 'spiral', dur: 230 }, { n: 'wall', dur: 200 }, { n: 'shotgun', dur: 180 }],
    [{ n: 'ring', dur: 190 }, { n: 'arms', dur: 240 }, { n: 'cross', dur: 190 }, { n: 'expand', dur: 200 }],
    [{ n: 'summon', dur: 170 }, { n: 'shotgun', dur: 170 }, { n: 'charge', dur: 230 }, { n: 'spray', dur: 200 }]
  ];
  function spawnBoss() {
    const type = bossCount % 3; bossCount++;
    const maxhp = Math.round(70 + wave * 26);
    boss = {
      type, x: W / 2, y: -90, r: 48, hp: maxhp, maxhp, vx: 1.6 * spdScale(), phase: 0, spin: 0,
      shootCD: 60, enter: true, color: BOSS_COLORS[type], name: BOSS_NAMES[type],
      seq: BOSS_PATTERNS[type], patI: 0, patTimer: 9999, altf: 0, cstate: null, ctimer: 0, tx: W / 2, flash: 0
    };
    Audio.boss(); floatMsg = { t: 90, txt: '⚠ BOSS ⚠', color: '#ff8fa0' };
  }
  function eb2(x, y, ang, spd, r) { ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: r || 6 }); }
  function ring(x, y, count, spd, offset) { for (let i = 0; i < count; i++) { const a = offset + i / count * Math.PI * 2; ebullets.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 6 }); } }

  // ===================== XP / LEVEL =====================
  function addXP(n) {
    xp += n;
    while (xp >= xpNext) { xp -= xpNext; level++; xpNext = Math.round(20 + level * 11); pendingLevels++; }
    if (pendingLevels > 0 && state === STATE.PLAY) openLevelUp();
    updateHUD();
  }
  function grantKill(e) {
    if (e.dead || e.gone) return; e.dead = true; score += e.score;
    spawnParticles(e.x, e.y, e.color, 16, 4.5); Audio.hit();
    if (Math.random() < 0.14) dropGem(e.x, e.y); else if (hp < maxHp && Math.random() < 0.035) dropHeart(e.x, e.y);
    if (stats.explosive > 0) explode(e.x, e.y, stats.explosive, stats.damage * 0.8);
    addXP(e.xp);
  }
  function explode(x, y, radius, dmg) {
    spawnParticles(x, y, '#ffb066', 10, 3.5); booms.push({ x, y, r: 6, max: radius, life: 12 });
    for (const e of enemies) { if (e.dead || e.gone) continue; if (hit(e.x, e.y, e.r, x, y, radius)) { e.hp -= dmg; if (e.hp <= 0) grantKill(e); } }
    if (boss && !boss.enter && hit(boss.x, boss.y, boss.r, x, y, radius)) damageBoss(dmg);
  }

  // ===================== UPDATE =====================
  function update() {
    tick++;
    for (const s of stars) { s.y += s.z * 1.6; if (s.y > H) { s.y = -2; s.x = rand(0, W); } }
    for (const e of embers) { e.y -= e.vy; e.x += e.dx + Math.sin(tick * 0.02 + e.y * 0.05) * 0.2; if (e.y < -4) { e.y = H + 4; e.x = rand(0, W); } }
    if (state !== STATE.PLAY) return;

    player.tx = clamp(player.tx, player.r, W - player.r);
    player.ty = clamp(player.ty, player.r + 20, H - player.r - 10);
    player.x += (player.tx - player.x) * stats.moveLerp;
    player.y += (player.ty - player.y) * stats.moveLerp;
    if (invuln > 0) invuln--; if (shake > 0) shake *= 0.86;

    if (--fireCD <= 0) { fire(); fireCD = stats.fireInterval; }

    // companion mini-dragons
    for (const m of mates) {
      m.x = player.x + m.side * 32; m.y = player.y + 8 + Math.sin(tick * 0.1 + m.side) * 4;
      if (--m.shootCD <= 0) { mateFire(m); m.shootCD = m.data.interval; }
    }

    if (!boss) {
      if (--spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(11, 44 - wave * 2); }
      waveTimer++;
      if (waveTimer > 60 * 12) {
        wave++; waveTimer = 0; updateHUD();
        if (wave % 3 === 0) spawnBoss(); else floatMsg = { t: 55, txt: 'WAVE ' + wave, color: '#fff' };
      }
    }

    for (const b of bullets) {
      b.x += b.vx; b.y += b.vy;
      if (b.x < b.r) { if (b.bounce > 0) { b.x = b.r; b.vx = -b.vx; b.bounce--; } else b.dead = true; }
      else if (b.x > W - b.r) { if (b.bounce > 0) { b.x = W - b.r; b.vx = -b.vx; b.bounce--; } else b.dead = true; }
      if (b.y < b.r) { if (b.bounce > 0) { b.y = b.r; b.vy = -b.vy; b.bounce--; } else b.dead = true; }
      if (b.y > H + 16) b.dead = true;
    }

    for (const e of enemies) {
      e.y += e.vy;
      if (e.t === 'zig') {
        e.ph += 0.05; e.x = e.baseX + Math.sin(e.ph) * e.amp;
        if (--e.shootCD <= 0 && e.y > 0 && e.y < H * 0.7) { enemyShoot(e.x, e.y, player.x, player.y, 3.4 * ebScale()); e.shootCD = rand(70, 130); }
      } else if (e.t === 'dive') { e.x += Math.sin(tick * 0.05 + e.y * 0.02) * 0.6; }
      if (e.y > H + 34) e.gone = true;

      if (!e.gone && !e.dead) {
        for (const b of bullets) {
          if (b.dead || (b.hit && b.hit.has(e.id))) continue;
          if (hit(e.x, e.y, e.r, b.x, b.y, b.r + 1)) {
            e.hp -= b.dmg;
            spawnParticles(b.x, b.y, b.crit ? '#fff2a0' : e.color, b.crit ? 8 : 4, b.crit ? 4 : 3);
            if (e.hp <= 0) grantKill(e);
            if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = new Set())).add(e.id); } else b.dead = true;
            if (e.dead) break;
          }
        }
      }
      if (!e.gone && !e.dead && hit(e.x, e.y, e.r, player.x, player.y, player.r - 4)) { spawnParticles(e.x, e.y, e.color, 12, 4); e.gone = true; playerHurt(); }
    }

    if (boss) updateBoss();

    for (const b of ebullets) {
      b.x += b.vx; b.y += b.vy;
      if (b.y > H + 20 || b.y < -30 || b.x < -30 || b.x > W + 30) { b.dead = true; continue; }
      if (hit(b.x, b.y, b.r, player.x, player.y, player.r - 4)) { b.dead = true; playerHurt(); }
    }

    for (const p of drops) {
      const dx = player.x - p.x, dy = player.y - p.y, dist = Math.hypot(dx, dy) || 1;
      if (dist < stats.magnet) { p.x += dx / dist * 4.2; p.y += dy / dist * 4.2; } else p.y += p.vy;
      if (p.y > H + 20) { p.dead = true; continue; }
      if (hit(p.x, p.y, p.r, player.x, player.y, player.r + 4)) {
        p.dead = true;
        if (p.kind === 'heart') { hp = Math.min(maxHp, hp + 1); spawnParticles(p.x, p.y, '#ff8fa0', 16, 3.5); Audio.power(); }
        else { score += 15; addXP(3); spawnParticles(p.x, p.y, '#ffcf5a', 12, 3); Audio.power(); }
        updateHUD();
      }
    }

    for (const bm of booms) { bm.r += (bm.max - bm.r) * 0.4; bm.life--; if (bm.life <= 0) bm.dead = true; }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; if (--p.life <= 0) p.dead = true; }

    bullets = bullets.filter(b => !b.dead); enemies = enemies.filter(e => !e.dead && !e.gone);
    ebullets = ebullets.filter(b => !b.dead); drops = drops.filter(p => !p.dead);
    booms = booms.filter(b => !b.dead); particles = particles.filter(p => !p.dead);
  }

  function damageBoss(dmg) {
    boss.hp -= dmg;
    if (boss.hp <= 0) {
      score += 300 + wave * 20; spawnParticles(boss.x, boss.y, '#ff8fa0', 70, 6.5); shake = 24; Audio.explode();
      const bx = boss.x, by = boss.y; boss = null;
      for (let k = 0; k < 5; k++) setTimeout(() => spawnParticles(bx + rand(-30, 30), by + rand(-30, 30), '#ffd0a0', 12, 5), k * 60);
      addXP(45); floatMsg = { t: 70, txt: 'BOSS DOWN!', color: '#ffd76a' }; updateHUD();
    }
  }
  function aimAt(x, y) { return Math.atan2(player.y - y, player.x - x); }
  function updateBoss() {
    const b = boss;
    if (b.enter) { b.y += 1.7; if (b.y >= 116) { b.enter = false; b.patTimer = b.seq[0].dur; } return; }
    b.phase += 0.02; b.spin += 0.05; if (b.flash > 0) b.flash--;
    const hpr = b.hp / b.maxhp, eb = ebScale(), en = hpr < 0.4 ? 0.68 : 1;

    // advance attack pattern
    if (--b.patTimer <= 0) {
      b.patI = (b.patI + 1) % b.seq.length; b.patTimer = b.seq[b.patI].dur; b.shootCD = 0;
      if (b.seq[b.patI].n === 'charge') { b.cstate = 'warn'; b.ctimer = 48; b.flash = 48; }
    }
    const pat = b.seq[b.patI].n;

    // movement
    if (pat === 'charge') {
      if (b.cstate === 'warn') { b.tx = player.x; if (--b.ctimer <= 0) b.cstate = 'dash'; }
      else if (b.cstate === 'dash') {
        b.x += (b.tx - b.x) * 0.05; b.y += 7;
        if (tick % 6 === 0) { eb2(b.x, b.y, Math.PI / 2 - 0.3, 2.6 * eb); eb2(b.x, b.y, Math.PI / 2 + 0.3, 2.6 * eb); }
        if (b.y > H * 0.6) { b.cstate = 'back'; ring(b.x, b.y, 14, 2.8 * eb, b.phase); }
      } else { b.y += (116 - b.y) * 0.06; b.x += (W / 2 - b.x) * 0.04; }
    } else if (b.type === 1) {
      b.x = W / 2 + Math.sin(b.phase) * (W * 0.28); b.y = 110 + Math.cos(b.phase * 0.7) * 14;
    } else {
      b.x += b.vx; if (b.x < b.r + 6 || b.x > W - b.r - 6) b.vx *= -1; b.y = 116 + Math.sin(b.phase) * 20;
    }

    // firing per pattern
    b.shootCD--;
    if (b.shootCD <= 0) {
      const by = b.y + b.r * 0.5;
      switch (pat) {
        case 'aimed3': { const a0 = aimAt(b.x, by); for (let k = -1; k <= 1; k++) eb2(b.x, by, a0 + k * 0.2, 3.6 * eb); b.shootCD = Math.round(38 * en); break; }
        case 'spiral': { const base = b.spin * 2.3; for (let k = 0; k < 3; k++) eb2(b.x, by, base + k * 2.094, 2.9 * eb); b.shootCD = 5; break; }
        case 'wall': { const gap = rand(40, W - 40), gw = 46; for (let gx = 20; gx < W - 10; gx += 34) if (Math.abs(gx - gap) > gw) eb2(gx, b.y, Math.PI / 2, 2.5 * eb); b.shootCD = Math.round(30 * en); break; }
        case 'shotgun': { const a0 = aimAt(b.x, by), n = hpr < 0.4 ? 9 : 7; for (let k = 0; k < n; k++) eb2(b.x, by, a0 + (k / (n - 1) - 0.5) * 1.05, 3.5 * eb); b.shootCD = Math.round(44 * en); break; }
        case 'ring': { const cnt = hpr < 0.5 ? 18 : 13; ring(b.x, b.y, cnt, 2.7 * eb, b.phase); b.shootCD = Math.round(52 * en); break; }
        case 'arms': { for (let k = 0; k < 4; k++) eb2(b.x, b.y, b.spin * 1.6 + k * 1.571, 2.7 * eb); b.shootCD = 6; break; }
        case 'cross': { b.altf ^= 1; const off = b.altf ? 0.393 : 0; for (let k = 0; k < 8; k++) eb2(b.x, b.y, off + k * 0.785, 3 * eb); b.shootCD = Math.round(30 * en); break; }
        case 'expand': { for (let s = 0; s < 3; s++) ring(b.x, b.y, 12, (2 + s) * eb, b.phase + s * 0.26); b.shootCD = Math.round(40 * en); break; }
        case 'summon': { const a0 = aimAt(b.x, by); for (let k = -1; k <= 1; k++) eb2(b.x, by, a0 + k * 0.3, 3.2 * eb); spawnMinion(b.x - 24, b.y); spawnMinion(b.x + 24, b.y); if (hpr < 0.5) spawnMinion(b.x, b.y); b.shootCD = Math.round(60 * en); break; }
        case 'spray': { eb2(b.x, by, aimAt(b.x, by) + rand(-0.5, 0.5), 3.2 * eb); if (tick % 90 === 0) spawnMinion(b.x + rand(-30, 30), b.y); b.shootCD = 7; break; }
        case 'charge': b.shootCD = 6; break;
      }
    }

    for (const bl of bullets) {
      if (bl.dead || bl.hitB) continue;
      if (hit(b.x, b.y, b.r, bl.x, bl.y, bl.r + 1)) {
        spawnParticles(bl.x, bl.y, bl.crit ? '#fff2a0' : '#ffd0d8', bl.crit ? 7 : 4, 3);
        damageBoss(bl.dmg);
        if (bl.pierce > 0) { bl.pierce--; bl.hitB = true; } else bl.dead = true;
        if (!boss) return;
      }
    }
    if (boss && hit(b.x, b.y, b.r, player.x, player.y, player.r - 2)) playerHurt();
  }

  function playerHurt() {
    if (invuln > 0) return; hp--; invuln = 95; shake = 15;
    spawnParticles(player.x, player.y, '#ff6b6b', 30, 5); Audio.hurt(); updateHUD();
    if (hp <= 0) gameOver();
  }

  // ===================== SKILLS =====================
  const SKILLS = [
    { id: 'dmg', ic: '⚔️', name: '攻撃力アップ', desc: '弾のダメージ +0.5', apply: () => stats.damage += 0.5, ok: () => true },
    { id: 'rate', ic: '🏹', name: '連射速度アップ', desc: '発射間隔を短縮', apply: () => stats.fireInterval = Math.max(3, stats.fireInterval - 1.6), ok: () => stats.fireInterval > 4 },
    { id: 'multi', ic: '✳️', name: 'マルチブレス', desc: '前方の炎 +1', apply: () => stats.projectiles += 1, ok: () => stats.projectiles < 7 },
    { id: 'side', ic: '↔️', name: 'サイドブレス', desc: '左右にも発射', rare: 1, apply: () => stats.side = true, ok: () => !stats.side },
    { id: 'rear', ic: '⬇️', name: 'テイルブレス', desc: '後方にも発射', rare: 1, apply: () => stats.rear = true, ok: () => !stats.rear },
    { id: 'diag', ic: '✴️', name: 'ディアゴナル', desc: '斜め4方向に発射', rare: 1, apply: () => stats.diagonal = true, ok: () => !stats.diagonal },
    { id: 'pierce', ic: '🔗', name: '貫通の炎', desc: '敵を貫通 +1', apply: () => stats.pierce += 1, ok: () => stats.pierce < 5 },
    { id: 'bounce', ic: '⚡', name: '跳ね炎', desc: '壁で跳ね返る +1', apply: () => stats.bounce += 1, ok: () => stats.bounce < 5 },
    { id: 'crit', ic: '🎯', name: 'クリティカル', desc: '会心率 +12%（2倍）', apply: () => stats.critChance = Math.min(0.85, stats.critChance + 0.12), ok: () => stats.critChance < 0.8 },
    { id: 'big', ic: '🔴', name: 'ビッグフレイム', desc: '炎が巨大化・ダメージ+0.3', apply: () => { stats.bulletR += 2; stats.damage += 0.3; }, ok: () => stats.bulletR < 12 },
    { id: 'bspd', ic: '🚀', name: '弾速アップ', desc: '炎のスピード上昇', apply: () => stats.bulletSpeed += 1.6, ok: () => stats.bulletSpeed < 15 },
    { id: 'explo', ic: '🧨', name: '爆炎', desc: '撃破時に爆発（範囲ダメージ）', rare: 1, apply: () => stats.explosive += 26, ok: () => stats.explosive < 90 },
    { id: 'hpup', ic: '❤️', name: '最大HPアップ', desc: 'ハート +1・全回復', rare: 1, apply: () => { maxHp += 1; hp = maxHp; }, ok: () => maxHp < 8 },
    { id: 'heal', ic: '🩹', name: '回復', desc: 'ハートを2回復', apply: () => hp = Math.min(maxHp, hp + 2), ok: () => hp < maxHp },
    { id: 'magnet', ic: '🧲', name: 'マグネット', desc: 'アイテム引き寄せ範囲UP', apply: () => stats.magnet += 40, ok: () => stats.magnet < 220 }
  ];
  function pickSkills(n) {
    const pool = SKILLS.filter(s => s.ok()), chosen = [];
    while (chosen.length < n && pool.length) {
      let total = 0; for (const s of pool) total += s.rare ? 1 : 2.4;
      let r = Math.random() * total, idx = 0;
      for (let i = 0; i < pool.length; i++) { r -= pool[i].rare ? 1 : 2.4; if (r <= 0) { idx = i; break; } }
      chosen.push(pool.splice(idx, 1)[0]);
    }
    return chosen;
  }
  const cardsEl = $('cards'), levelupEl = $('levelup');
  function openLevelUp() {
    state = STATE.LEVELUP; window.__playing = false; dragging = false; Audio.level();
    const choices = pickSkills(3); cardsEl.innerHTML = '';
    for (const s of choices) {
      const div = document.createElement('div'); div.className = 'card'; if (s.rare) div.dataset.rare = '1';
      div.innerHTML = `<div class="ic">${s.ic}</div><div class="tx"><h3>${s.name}</h3><p>${s.desc}</p></div>`;
      div.addEventListener('click', () => chooseSkill(s)); cardsEl.appendChild(div);
    }
    $('hud').style.display = 'none'; levelupEl.classList.remove('hidden');
  }
  function chooseSkill(s) {
    s.apply(); Audio.select(); vib(20); pendingLevels--; updateHUD();
    if (pendingLevels > 0) openLevelUp();
    else { levelupEl.classList.add('hidden'); $('hud').style.display = 'flex'; state = STATE.PLAY; window.__playing = true; fireCD = Math.min(fireCD, 4); }
  }

  // ===================== RENDER =====================
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16); let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = clamp(Math.round(r + (f > 0 ? (255 - r) * f : r * f)), 0, 255);
    g = clamp(Math.round(g + (f > 0 ? (255 - g) * f : g * f)), 0, 255);
    b = clamp(Math.round(b + (f > 0 ? (255 - b) * f : b * f)), 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function glowOrb(x, y, r, inner, mid) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, inner); g.addColorStop(.45, mid); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  }
  function drawDragonShape(s, col, belly, flap) {
    const fl = (flap || 0), light = shade(col, .32), dark = shade(col, -.38), mid = shade(col, -.05);
    // tail (swaying)
    const tw = Math.sin(tick * 0.16) * s * 0.35;
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(-s * 0.2, s * 0.7); ctx.quadraticCurveTo(tw, s * 1.2, tw * 1.4, s * 1.7); ctx.quadraticCurveTo(tw * 1.1, s * 1.35, s * 0.2, s * 0.7); ctx.closePath(); ctx.fill();
    // tail fin
    ctx.beginPath(); ctx.moveTo(tw * 1.4, s * 1.7); ctx.lineTo(tw * 1.4 - s * 0.28, s * 1.9); ctx.lineTo(tw * 1.4 + s * 0.28, s * 1.9); ctx.closePath(); ctx.fill();
    // wings (membrane + bone + highlight), flap raises tips
    for (const sgn of [-1, 1]) {
      const wg = ctx.createLinearGradient(0, -s, sgn * s * 1.5, s * 0.4);
      wg.addColorStop(0, mid); wg.addColorStop(1, dark);
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.moveTo(sgn * s * 0.2, -s * 0.1);
      ctx.quadraticCurveTo(sgn * s * 1.1, -s * (0.7 + fl), sgn * s * 1.55, -s * (0.45 + fl));
      ctx.lineTo(sgn * s * 1.35, s * 0.35);
      ctx.quadraticCurveTo(sgn * s * 0.8, s * 0.05, sgn * s * 0.2, s * 0.2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade(col, -.5); ctx.lineWidth = Math.max(1, s * 0.06);
      ctx.beginPath(); ctx.moveTo(sgn * s * 0.25, 0); ctx.lineTo(sgn * s * 1.45, -s * (0.4 + fl)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sgn * s * 0.25, s * 0.05); ctx.lineTo(sgn * s * 1.15, s * 0.1); ctx.stroke();
      // leading-edge highlight
      ctx.strokeStyle = shade(col, .4); ctx.lineWidth = Math.max(1, s * 0.04);
      ctx.beginPath(); ctx.moveTo(sgn * s * 0.2, -s * 0.1); ctx.quadraticCurveTo(sgn * s * 1.1, -s * (0.72 + fl), sgn * s * 1.55, -s * (0.46 + fl)); ctx.stroke();
    }
    // back spikes
    ctx.fillStyle = mid;
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * s * 0.28, s * 0.1); ctx.lineTo(k * s * 0.28 - s * 0.12, s * 0.55); ctx.lineTo(k * s * 0.28 + s * 0.12, s * 0.55); ctx.closePath(); ctx.fill(); }
    // body (radial gradient for volume)
    const bg = ctx.createRadialGradient(-s * 0.2, -s * 0.3, s * 0.1, 0, 0, s * 1.1);
    bg.addColorStop(0, light); bg.addColorStop(.6, mid); bg.addColorStop(1, dark);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.56, s * 0.96, 0, 0, 6.28); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(0, -s * 0.85, s * 0.5, 0, 6.28); ctx.fill();
    // snout
    ctx.fillStyle = mid; ctx.beginPath(); ctx.ellipse(0, -s * 0.6, s * 0.28, s * 0.2, 0, 0, 6.28); ctx.fill();
    // horns
    ctx.fillStyle = shade(col, -.15);
    ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 1.1); ctx.lineTo(-s * 0.58, -s * 1.65); ctx.lineTo(-s * 0.08, -s * 1.2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s * 0.35, -s * 1.1); ctx.lineTo(s * 0.58, -s * 1.65); ctx.lineTo(s * 0.08, -s * 1.2); ctx.closePath(); ctx.fill();
    // belly
    ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(0, s * 0.18, s * 0.3, s * 0.56, 0, 0, 6.28); ctx.fill();
    // glowing eyes
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#fff6c0'; ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.85, s * 0.15, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.arc(s * 0.2, -s * 0.85, s * 0.15, 0, 6.28); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a0a06'; ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.83, s * 0.06, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.arc(s * 0.2, -s * 0.83, s * 0.06, 0, 6.28); ctx.fill();
  }

  function draw() {
    let sx = 0, sy = 0; if (shake > 0.5) { sx = rand(-shake, shake); sy = rand(-shake, shake); }
    ctx.save(); ctx.translate(sx, sy);
    // deep space base + layered nebula
    ctx.fillStyle = '#08040e'; ctx.fillRect(-20, -20, W + 40, H + 40);
    const g = ctx.createRadialGradient(W / 2, H * 0.16, 0, W / 2, H * 0.16, H * 1.05);
    g.addColorStop(0, 'rgba(120,35,45,0.42)'); g.addColorStop(.4, 'rgba(60,25,70,0.28)'); g.addColorStop(1, 'rgba(8,4,14,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const g2 = ctx.createRadialGradient(W * 0.8, H * 0.75, 0, W * 0.8, H * 0.75, H * 0.7);
    g2.addColorStop(0, 'rgba(40,30,90,0.25)'); g2.addColorStop(1, 'rgba(8,4,14,0)');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

    // distant planet, slowly drifting down (parallax)
    const plY = ((tick * 0.12) % (H + 340)) - 170, plX = W * 0.24, plR = W * 0.30;
    const pg = ctx.createRadialGradient(plX - plR * 0.35, plY - plR * 0.35, plR * 0.1, plX, plY, plR);
    pg.addColorStop(0, 'rgba(120,90,150,0.55)'); pg.addColorStop(.55, 'rgba(70,45,95,0.42)'); pg.addColorStop(1, 'rgba(20,12,30,0.05)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(plX, plY, plR, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'rgba(200,150,220,0.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(plX, plY, plR * 1.35, plR * 0.34, -0.4, 0, 6.28); ctx.stroke();
    // rim light
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(180,140,255,0.28)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(plX - plR * 0.3, plY - plR * 0.32, plR * 0.98, -0.4, 1.4); ctx.stroke(); ctx.restore();

    // twinkling parallax stars
    for (const s of stars) { const tw = 0.55 + 0.45 * Math.sin(tick * 0.05 + s.tw); ctx.globalAlpha = clamp(s.z / 1.4, .2, 1) * tw; ctx.fillStyle = s.z > 1 ? '#ffe6d0' : '#9fb0d8'; ctx.fillRect(s.x, s.y, s.s, s.s * 2.1); }
    ctx.globalAlpha = 1;

    // rising embers (additive)
    ctx.globalCompositeOperation = 'lighter';
    for (const e of embers) { ctx.globalAlpha = e.a * (0.6 + 0.4 * Math.sin(tick * 0.06 + e.x)); glowOrb(e.x, e.y, e.r * 3.2, 'rgba(255,170,90,0.9)', 'rgba(255,90,40,0.35)'); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    ctx.globalCompositeOperation = 'lighter';
    for (const bm of booms) { ctx.globalAlpha = clamp(bm.life / 12, 0, .7); glowOrb(bm.x, bm.y, bm.r, 'rgba(255,220,150,0.95)', 'rgba(255,120,40,0.5)'); }
    for (const p of particles) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    if (state !== STATE.START) {
      for (const p of drops) {
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.kind === 'heart') { ctx.shadowColor = '#ff5c8a'; ctx.shadowBlur = 12; ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('❤️', 0, 1); }
        else {
          ctx.rotate(tick * 0.05); ctx.fillStyle = '#ffd66a'; ctx.shadowColor = '#ff9a3d'; ctx.shadowBlur = 12;
          ctx.beginPath(); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; ctx.lineTo(Math.cos(a) * p.r, Math.sin(a) * p.r); ctx.lineTo(Math.cos(a + 0.785) * p.r * 0.45, Math.sin(a + 0.785) * p.r * 0.45); } ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      ctx.shadowBlur = 0;

      for (const e of enemies) drawEnemy(e);
      if (boss) drawBoss(boss);

      // companion dragons (with wing flap)
      if (state !== STATE.OVER) for (const m of mates) { ctx.save(); ctx.translate(m.x, m.y); const fl = Math.sin(tick * 0.3 + m.side) * 0.18; drawDragonShape(8, m.data.color, '#fff2d8', fl); ctx.restore(); }

      // player fire (breath) — additive glow + motion trail + core, kept warm gold
      ctx.globalCompositeOperation = 'lighter';
      for (const b of bullets) {
        const core = b.crit ? '#fff3c0' : (b.col ? shade(b.col, .5) : '#ffe6a0');
        const glow = b.crit ? 'rgba(255,200,80,0.6)' : (b.col ? 'rgba(120,200,255,0.5)' : 'rgba(255,150,40,0.55)');
        // trail: a few fading orbs behind the bullet
        for (let t = 1; t <= 3; t++) { ctx.globalAlpha = 0.22 * (4 - t); glowOrb(b.x - b.vx * t * 0.55, b.y - b.vy * t * 0.55, b.r * (2.2 - t * 0.4), glow, 'rgba(0,0,0,0)'); }
        ctx.globalAlpha = 1;
        glowOrb(b.x - b.vx * 0.4, b.y - b.vy * 0.4, b.r * 2.6, glow, 'rgba(0,0,0,0)');
        ctx.fillStyle = core; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.85, 0, 6.28); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      // enemy fire — additive red glow + hot white core, pops over player fire
      for (const b of ebullets) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        glowOrb(b.x, b.y, (b.r + 2) * 2.2, 'rgba(255,60,100,0.9)', 'rgba(255,20,70,0.4)');
        ctx.restore();
        ctx.fillStyle = '#ff2d5b'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 0.5, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, 6.28); ctx.fill();
      }

      ctx.font = '900 32px -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(floatMsg.txt, W / 2, H * 0.34); ctx.globalAlpha = 1;
    }

    if (boss && !boss.enter) {

      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 10);
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(bx, by, bw, 6);
      ctx.fillStyle = boss.color; ctx.fillRect(bx, by, bw * clamp(boss.hp / boss.maxhp, 0, 1), 6);
      ctx.fillStyle = '#fff'; ctx.globalAlpha = .85; ctx.font = '700 11px -apple-system, sans-serif'; ctx.textAlign = 'center';

    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawPlayer() {
    const p = player;
    ctx.save(); ctx.translate(p.x, p.y);
    if (invuln > 0 && Math.floor(tick / 4) % 2 === 0) ctx.globalAlpha = 0.4;
    // engine flame (additive)
    const flame = 8 + Math.sin(tick * 0.6) * 3;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glowOrb(0, p.r * 0.95 + flame * 0.4, flame * 1.3, 'rgba(255,210,120,0.9)', 'rgba(255,110,40,0.5)');
    ctx.restore();
    const fl = Math.sin(tick * 0.28) * 0.16;
    drawDragonShape(p.r * 0.94, '#e0453b', '#ffd9a0', fl);
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5; glowOrb(0, 0, e.r * 2.2, shade(e.color, .1), 'rgba(0,0,0,0)'); ctx.restore();
    const grad = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.3, 0, 0, 0, e.r * 1.2);
    grad.addColorStop(0, shade(e.color, .35)); grad.addColorStop(1, shade(e.color, -.3));
    ctx.fillStyle = grad;
    if (e.t === 'dive') { // wyvern
      ctx.rotate(Math.PI);
      ctx.beginPath(); ctx.moveTo(0, -e.r); ctx.lineTo(e.r, e.r); ctx.lineTo(0, e.r * 0.4); ctx.lineTo(-e.r, e.r); ctx.closePath(); ctx.fill();
      ctx.fillStyle = shade(e.color, -.5); ctx.beginPath(); ctx.moveTo(0, -e.r * 0.2); ctx.lineTo(e.r * 0.7, e.r * 0.7); ctx.lineTo(0, e.r * 0.3); ctx.closePath(); ctx.fill();
    } else if (e.t === 'zig') { // cursed flame orb
      ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + tick * 0.02; ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r); } ctx.closePath(); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, e.r * 0.26, 0, 6.28); ctx.fill(); ctx.restore();
    } else { // bat dragon
      const f = Math.sin((e.wing || 0) + tick * 0.2) * 0.4;
      ctx.fillStyle = shade(e.color, -.25);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-e.r * 1.3, -e.r * (0.5 + f), -e.r * 1.45, e.r * 0.4); ctx.quadraticCurveTo(-e.r * 0.8, e.r * 0.1, 0, e.r * 0.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(e.r * 1.3, -e.r * (0.5 + f), e.r * 1.45, e.r * 0.4); ctx.quadraticCurveTo(e.r * 0.8, e.r * 0.1, 0, e.r * 0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, e.r * 0.55, 0, 6.28); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#ff6a86'; ctx.beginPath(); ctx.arc(-e.r * 0.22, -e.r * 0.05, e.r * 0.13, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.arc(e.r * 0.22, -e.r * 0.05, e.r * 0.13, 0, 6.28); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }

  function drawBoss(b) {
    ctx.save(); ctx.translate(b.x, b.y);
    // pulsing aura
    const pulse = 1 + Math.sin(tick * 0.12) * 0.06;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = b.flash > 0 ? 0.9 : 0.5;
    glowOrb(0, 0, b.r * 2.3 * pulse, shade(b.color, .2), 'rgba(0,0,0,0)'); ctx.restore();
    // wings behind
    const wf = Math.sin(tick * 0.12) * 0.12;
    ctx.fillStyle = shade(b.color, -.45);
    for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sgn * b.r * 0.5, -b.r * 0.1); ctx.quadraticCurveTo(sgn * b.r * 1.7, -b.r * (0.9 + wf), sgn * b.r * 1.9, b.r * 0.5); ctx.quadraticCurveTo(sgn * b.r * 1.1, b.r * 0.2, sgn * b.r * 0.4, b.r * 0.4); ctx.closePath(); ctx.fill(); }
    // horns
    ctx.fillStyle = shade(b.color, -.2);
    ctx.beginPath(); ctx.moveTo(-b.r * 0.55, -b.r * 0.5); ctx.lineTo(-b.r * 0.95, -b.r * 1.2); ctx.lineTo(-b.r * 0.22, -b.r * 0.6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.r * 0.55, -b.r * 0.5); ctx.lineTo(b.r * 0.95, -b.r * 1.2); ctx.lineTo(b.r * 0.22, -b.r * 0.6); ctx.closePath(); ctx.fill();
    // head/body gradient
    const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, 0, 0, 0, b.r * 1.2);
    bg.addColorStop(0, shade(b.color, .3)); bg.addColorStop(1, shade(b.color, -.35));
    ctx.fillStyle = bg;
    if (b.type === 1) { ctx.save(); ctx.rotate(b.phase); ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5, rr = k % 2 ? b.r * 0.6 : b.r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.restore(); }
    else { ctx.beginPath(); ctx.ellipse(0, 0, b.r, b.r * 0.76, 0, 0, 6.28); ctx.fill(); }
    // snout / mouth
    ctx.fillStyle = '#2a0714'; ctx.beginPath(); ctx.ellipse(0, b.r * 0.18, b.r * 0.55, b.r * 0.32, 0, 0, 6.28); ctx.fill();
    // teeth
    ctx.fillStyle = '#fff';
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * b.r * 0.2, b.r * 0.02); ctx.lineTo(k * b.r * 0.2 - b.r * 0.05, b.r * 0.02); ctx.lineTo(k * b.r * 0.2 - b.r * 0.02, b.r * 0.2); ctx.closePath(); ctx.fill(); }
    // glowing eyes
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const ec = b.flash > 0 && Math.floor(tick / 5) % 2 ? '#ffffff' : '#ffe36a';
    ctx.fillStyle = ec; ctx.beginPath(); ctx.arc(-b.r * 0.34, -b.r * 0.08, 7, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.arc(b.r * 0.34, -b.r * 0.08, 7, 0, 6.28); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a0714'; ctx.beginPath(); ctx.arc(-b.r * 0.34, -b.r * 0.06, 2.6, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.arc(b.r * 0.34, -b.r * 0.06, 2.6, 0, 6.28); ctx.fill();
    // nostrils with smoke glow
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(-b.r * 0.12, b.r * 0.32, 2.4, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.arc(b.r * 0.12, b.r * 0.32, 2.4, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  // ===================== HUD =====================
  function updateHUD() {
    $('score').textContent = score; $('wave').textContent = wave; $('level').textContent = level;
    $('xpfill').style.width = clamp(xp / xpNext * 100, 0, 100) + '%';
    $('lives').textContent = '❤️'.repeat(Math.max(0, hp)) + '🤍'.repeat(Math.max(0, maxHp - hp));
  }

  // ===================== LOOP =====================
  makeStars();
  let last = performance.now(), acc = 0; const STEP = 1000 / 60;
  function loop(now) { acc += now - last; last = now; if (acc > 200) acc = 200; while (acc >= STEP) { update(); acc -= STEP; } draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ===================== GACHA / EQUIP UI =====================
  function refreshMetaUI() {
    $('coinsT').textContent = meta.coins; $('coinsG').textContent = meta.coins;
    const w = WEAPONS[meta.equipWeapon], d = DRAGONS[meta.equipDragon];
    $('equipSummary').innerHTML = `武器: <b>${w.name}</b> ／ お供: <b>${d.name}</b>`;
    $('startBest').textContent = meta.best > 0 ? 'ベストスコア: ' + meta.best : '';
    $('pull1').classList.toggle('dis', meta.coins < 100);
    $('pull10').classList.toggle('dis', meta.coins < 900);
  }
  function rollRarity() { const w = [62, 27, 9, 2]; let r = Math.random() * 100, i = 0; for (; i < 4; i++) { r -= w[i]; if (r <= 0) return i; } return 0; }
  function pullOne() {
    let rar = rollRarity(), pool = GACHA.filter(it => idata(it).rarity === rar);
    while (!pool.length && rar > 0) { rar--; pool = GACHA.filter(it => idata(it).rarity === rar); }
    const it = pool[Math.floor(Math.random() * pool.length)];
    const owned = it.t === 'w' ? !!meta.weapons[it.id] : !!meta.dragons[it.id];
    if (owned) { meta.coins += REFUND[rar]; }
    else { if (it.t === 'w') meta.weapons[it.id] = true; else meta.dragons[it.id] = true; }
    return { it, rar, dup: owned };
  }
  function doPull(count, cost) {
    if (meta.coins < cost) return;
    meta.coins -= cost;
    const results = []; let bestRar = 0;
    for (let i = 0; i < count; i++) { const r = pullOne(); results.push(r); if (r.rar > bestRar) bestRar = r.rar; }
    saveMeta(); refreshMetaUI();
    if (bestRar >= 3) Audio.legend(); else Audio.gacha();
    const res = $('gachaResult'); res.innerHTML = '';
    results.forEach((r, i) => {
      const it = r.it, dt = idata(it), col = RARITY[r.rar].color;
      const c = document.createElement('div'); c.className = 'gcell';
      c.style.borderColor = col; c.style.animationDelay = (i * 0.04) + 's';
      c.innerHTML = `<div class="gi">${dt.icon}</div><div class="gn" style="color:${col}">${dt.name}${r.dup ? '<br><span style="opacity:.6">重複→🪙' + REFUND[r.rar] + '</span>' : ''}</div>`;
      res.appendChild(c);
    });
    const gained = results.filter(r => !r.dup).length;
    $('gachaMsg').textContent = gained > 0 ? `新規 ${gained}体/個 獲得！「そうび」で装備できます` : 'すべて重複…コインに還元しました';
  }
  function renderEquip() {
    const wl = $('weaponList'); wl.innerHTML = '';
    Object.keys(WEAPONS).forEach(id => {
      const w = WEAPONS[id], owned = !!meta.weapons[id], col = RARITY[w.rarity].color;
      const c = document.createElement('div'); c.className = 'chip' + (meta.equipWeapon === id ? ' eq' : '') + (owned ? '' : ' locked');
      c.innerHTML = `<div class="ci">${w.icon}</div><div class="cn">${w.name}</div><div class="cr" style="color:${col}">${owned ? RARITY[w.rarity].name : '未所持'}</div>`;
      if (owned) c.addEventListener('click', () => { meta.equipWeapon = id; saveMeta(); renderEquip(); refreshMetaUI(); Audio.select(); });
      wl.appendChild(c);
    });
    const dl = $('dragonList'); dl.innerHTML = '';
    Object.keys(DRAGONS).forEach(id => {
      const d = DRAGONS[id], owned = id === 'none' || !!meta.dragons[id], col = RARITY[d.rarity].color;
      const c = document.createElement('div'); c.className = 'chip' + (meta.equipDragon === id ? ' eq' : '') + (owned ? '' : ' locked');
      c.innerHTML = `<div class="ci">${d.icon}</div><div class="cn">${d.name}</div><div class="cr" style="color:${col}">${owned ? (id === 'none' ? '解除' : RARITY[d.rarity].name) : '未所持'}</div>`;
      if (owned) c.addEventListener('click', () => { meta.equipDragon = id; saveMeta(); renderEquip(); refreshMetaUI(); Audio.select(); });
      dl.appendChild(c);
    });
  }

  // ===================== FLOW =====================
  const startScreen = $('startScreen'), overScreen = $('overScreen'), gachaScreen = $('gachaScreen'), equipScreen = $('equipScreen'), pauseScreen = $('pauseScreen'), hud = $('hud');
  function hideAllOverlays() { [startScreen, overScreen, gachaScreen, equipScreen, pauseScreen, levelupEl].forEach(o => o.classList.add('hidden')); }

  function startGame() {
    Audio.resume(); reset(); state = STATE.PLAY; window.__playing = true;
    hideAllOverlays(); hud.style.display = 'flex'; updateMuteBtn();
  }
  function gameOver() {
    state = STATE.OVER; window.__playing = false; Audio.over();
    const earned = Math.floor(score / 5) + wave * 10; meta.coins += earned;
    if (score > meta.best) meta.best = score; saveMeta();
    $('finalScore').textContent = score;
    $('earnCoins').textContent = '獲得コイン +' + earned + ' 🪙（所持 ' + meta.coins + '）';
    $('overBest').textContent = meta.best > 0 ? 'ベスト: ' + meta.best : '';
    $('overTag').textContent = 'GAME OVER · Lv' + level + ' · WAVE' + wave;
    hud.style.display = 'none'; overScreen.classList.remove('hidden');
  }
  function toTitle() { state = STATE.START; window.__playing = false; hideAllOverlays(); hud.style.display = 'none'; refreshMetaUI(); startScreen.classList.remove('hidden'); }

  function updateMuteBtn() { $('muteBtn').textContent = Audio.isMuted() ? '🔇' : '🔊'; }
  $('muteBtn').addEventListener('click', e => { e.stopPropagation(); Audio.resume(); Audio.toggleMute(); updateMuteBtn(); });
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('toTitleBtn').addEventListener('click', toTitle);

  // menu → gacha / equip
  $('gachaOpenBtn').addEventListener('click', () => { Audio.resume(); startScreen.classList.add('hidden'); $('gachaResult').innerHTML = ''; $('gachaMsg').textContent = 'レア以上でミニドラゴンや強力な武器をゲット！'; refreshMetaUI(); gachaScreen.classList.remove('hidden'); });
  $('equipOpenBtn').addEventListener('click', () => { startScreen.classList.add('hidden'); renderEquip(); equipScreen.classList.remove('hidden'); });
  $('gachaBack').addEventListener('click', () => { gachaScreen.classList.add('hidden'); refreshMetaUI(); startScreen.classList.remove('hidden'); });
  $('equipBack').addEventListener('click', () => { equipScreen.classList.add('hidden'); refreshMetaUI(); startScreen.classList.remove('hidden'); });
  $('pull1').addEventListener('click', () => doPull(1, 100));
  $('pull10').addEventListener('click', () => doPull(10, 900));

  // pause
  function pauseGame() { if (state !== STATE.PLAY) return; state = STATE.PAUSE; window.__playing = false; dragging = false; Audio.select(); hud.style.display = 'none'; pauseScreen.classList.remove('hidden'); }
  function resumeGame() { if (state !== STATE.PAUSE) return; state = STATE.PLAY; window.__playing = true; pauseScreen.classList.add('hidden'); hud.style.display = 'flex'; }
  $('pauseBtn').addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
  $('resumeBtn').addEventListener('click', resumeGame);
  $('quitBtn').addEventListener('click', toTitle);

  refreshMetaUI();
})();
</script>
</body>
</html>
