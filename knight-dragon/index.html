<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>騎士ドラ風 戦闘プロトタイプ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-sword" viewBox="0 0 16 24">
      <rect x="7" y="1" width="2" height="1" fill="#ffffff"/>
      <rect x="7" y="2" width="2" height="11" fill="#e8f8ff"/>
      <rect x="7" y="2" width="1" height="11" fill="#7be0ff"/>
      <rect x="6" y="5" width="1" height="6" fill="#9adde8"/>
      <rect x="9" y="5" width="1" height="6" fill="#5cc0d8"/>
      <rect x="7" y="13" width="2" height="1" fill="#9adde8"/>
      <rect x="2" y="14" width="12" height="2" fill="#a8a8b0"/>
      <rect x="2" y="14" width="12" height="1" fill="#dddde0"/>
      <rect x="1" y="14" width="1" height="3" fill="#444"/>
      <rect x="14" y="14" width="1" height="3" fill="#444"/>
      <rect x="6" y="16" width="4" height="2" fill="#d22020"/>
      <rect x="7" y="16" width="2" height="1" fill="#ff5050"/>
      <rect x="7" y="18" width="2" height="3" fill="#a5621a"/>
      <rect x="7" y="19" width="1" height="2" fill="#7a4814"/>
      <rect x="6" y="21" width="4" height="2" fill="#d4a040"/>
      <rect x="6" y="21" width="4" height="1" fill="#ffd870"/>
    </symbol>
    <symbol id="ico-spear" viewBox="0 0 16 24">
      <rect x="7" y="0" width="2" height="2" fill="#ffffff"/>
      <rect x="7" y="2" width="2" height="2" fill="#fff8c0"/>
      <rect x="6" y="3" width="4" height="2" fill="#ffe080"/>
      <rect x="5" y="5" width="6" height="2" fill="#ffd066"/>
      <rect x="5" y="6" width="1" height="1" fill="#fff5b0"/>
      <rect x="10" y="6" width="1" height="1" fill="#a87020"/>
      <rect x="6" y="7" width="4" height="2" fill="#d8a040"/>
      <rect x="7" y="9" width="2" height="1" fill="#a87020"/>
      <rect x="6" y="10" width="4" height="2" fill="#a5621a"/>
      <rect x="6" y="10" width="4" height="1" fill="#c88030"/>
      <rect x="7" y="12" width="2" height="10" fill="#7a4814"/>
      <rect x="7" y="12" width="1" height="10" fill="#a5621a"/>
      <rect x="6" y="14" width="4" height="1" fill="#ffd066"/>
      <rect x="6" y="20" width="4" height="2" fill="#d4a040"/>
      <rect x="6" y="20" width="4" height="1" fill="#ffd870"/>
    </symbol>
    <symbol id="ico-hammer" viewBox="0 0 16 24">
      <rect x="2" y="2" width="12" height="2" fill="#e8b478"/>
      <rect x="2" y="4" width="12" height="6" fill="#cc8855"/>
      <rect x="2" y="10" width="12" height="2" fill="#7a4814"/>
      <rect x="1" y="3" width="1" height="9" fill="#5a3008"/>
      <rect x="14" y="3" width="1" height="9" fill="#5a3008"/>
      <rect x="2" y="2" width="2" height="2" fill="#5a3008"/>
      <rect x="12" y="2" width="2" height="2" fill="#5a3008"/>
      <rect x="2" y="10" width="2" height="2" fill="#5a3008"/>
      <rect x="12" y="10" width="2" height="2" fill="#5a3008"/>
      <rect x="3" y="6" width="2" height="1" fill="#a06030"/>
      <rect x="11" y="6" width="2" height="1" fill="#a06030"/>
      <rect x="6" y="5" width="4" height="4" fill="#a06030"/>
      <rect x="7" y="6" width="2" height="2" fill="#ffd066"/>
      <rect x="7" y="12" width="2" height="10" fill="#7a4814"/>
      <rect x="7" y="12" width="1" height="10" fill="#a5621a"/>
      <rect x="6" y="14" width="4" height="1" fill="#ffd066"/>
      <rect x="6" y="20" width="4" height="2" fill="#d4a040"/>
      <rect x="6" y="20" width="4" height="1" fill="#ffd870"/>
    </symbol>
    <symbol id="ico-chest" viewBox="0 0 24 20">
      <rect x="2" y="6" width="20" height="12" fill="#7a4814"/>
      <rect x="3" y="7" width="18" height="10" fill="#a5621a"/>
      <rect x="3" y="11" width="18" height="2" fill="#7a4814"/>
      <rect x="2" y="2" width="20" height="6" fill="#7a4814"/>
      <rect x="3" y="3" width="18" height="4" fill="#a5621a"/>
      <rect x="3" y="3" width="18" height="1" fill="#cc8855"/>
      <rect x="11" y="9" width="2" height="4" fill="#ffd066"/>
      <rect x="10" y="11" width="4" height="2" fill="#ffd066"/>
    </symbol>
    <symbol id="ico-shield" viewBox="0 0 16 24">
      <rect x="3" y="2" width="10" height="2" fill="#80c0ff"/>
      <rect x="2" y="4" width="12" height="10" fill="#5fb0e8"/>
      <rect x="2" y="4" width="12" height="2" fill="#a0d4f8"/>
      <rect x="3" y="14" width="10" height="3" fill="#3a90c8"/>
      <rect x="5" y="17" width="6" height="2" fill="#2a7098"/>
      <rect x="6" y="19" width="4" height="1" fill="#1a5078"/>
      <rect x="1" y="3" width="1" height="13" fill="#3a5078"/>
      <rect x="14" y="3" width="1" height="13" fill="#3a5078"/>
      <rect x="6" y="6" width="4" height="6" fill="#ffd066"/>
      <rect x="7" y="7" width="2" height="4" fill="#ffe080"/>
      <rect x="2" y="2" width="2" height="2" fill="#3a5078"/>
      <rect x="12" y="2" width="2" height="2" fill="#3a5078"/>
    </symbol>

    <!-- ===== Unique UR weapon icons ===== -->
    <symbol id="ur-sword-deathsign" viewBox="0 0 16 24">
      <!-- skull on top of shaft -->
      <rect x="6" y="2" width="4" height="3" fill="#e8e8e8"/>
      <rect x="6" y="3" width="1" height="1" fill="#000"/>
      <rect x="9" y="3" width="1" height="1" fill="#000"/>
      <!-- curved scythe blade -->
      <rect x="9"  y="4" width="2" height="1" fill="#a8a8b8"/>
      <rect x="11" y="5" width="2" height="1" fill="#a8a8b8"/>
      <rect x="12" y="6" width="2" height="1" fill="#888898"/>
      <rect x="13" y="7" width="1" height="2" fill="#666678"/>
      <rect x="13" y="9" width="1" height="2" fill="#444458"/>
      <rect x="11" y="6" width="1" height="2" fill="#c0c0d0"/>
      <rect x="12" y="7" width="1" height="2" fill="#a0a0b0"/>
      <!-- black shaft -->
      <rect x="7" y="5" width="2" height="17" fill="#1a1a1a"/>
      <rect x="7" y="5" width="1" height="17" fill="#3a3a3a"/>
      <!-- dark binding -->
      <rect x="6" y="12" width="4" height="1" fill="#5a0040"/>
      <rect x="6" y="18" width="4" height="1" fill="#5a0040"/>
      <!-- pommel -->
      <rect x="6" y="22" width="4" height="2" fill="#6a0050"/>
    </symbol>
    <symbol id="ur-spear-umbrella" viewBox="0 0 16 24">
      <!-- top tip -->
      <rect x="7" y="2" width="2" height="2" fill="#ffd066"/>
      <!-- canopy curves -->
      <rect x="3"  y="4" width="10" height="1" fill="#80c0e8"/>
      <rect x="2"  y="5" width="12" height="1" fill="#80c0e8"/>
      <rect x="2"  y="6" width="12" height="1" fill="#a0d4f0"/>
      <rect x="1"  y="7" width="14" height="1" fill="#a0d4f0"/>
      <!-- ribs -->
      <rect x="5"  y="5" width="1" height="3" fill="#5090c0"/>
      <rect x="10" y="5" width="1" height="3" fill="#5090c0"/>
      <!-- canopy edge -->
      <rect x="2"  y="8" width="2" height="1" fill="#5090c0"/>
      <rect x="6"  y="8" width="1" height="1" fill="#5090c0"/>
      <rect x="9"  y="8" width="1" height="1" fill="#5090c0"/>
      <rect x="12" y="8" width="2" height="1" fill="#5090c0"/>
      <!-- shaft -->
      <rect x="7" y="8" width="2" height="13" fill="#a06030"/>
      <rect x="7" y="8" width="1" height="13" fill="#c08050"/>
      <!-- handle hook -->
      <rect x="6" y="21" width="4" height="2" fill="#a06030"/>
      <rect x="5" y="22" width="2" height="1" fill="#a06030"/>
    </symbol>
    <symbol id="ur-hammer-golden" viewBox="0 0 16 24">
      <rect x="2"  y="2"  width="12" height="2" fill="#fff8c0"/>
      <rect x="2"  y="4"  width="12" height="6" fill="#ffd066"/>
      <rect x="2"  y="10" width="12" height="2" fill="#a07020"/>
      <rect x="1"  y="3"  width="1"  height="9" fill="#806010"/>
      <rect x="14" y="3"  width="1"  height="9" fill="#806010"/>
      <rect x="2"  y="2"  width="2"  height="2" fill="#806010"/>
      <rect x="12" y="2"  width="2"  height="2" fill="#806010"/>
      <rect x="2"  y="10" width="2"  height="2" fill="#806010"/>
      <rect x="12" y="10" width="2"  height="2" fill="#806010"/>
      <!-- gem -->
      <rect x="6"  y="5" width="4" height="4" fill="#ff8000"/>
      <rect x="7"  y="6" width="2" height="2" fill="#ffaa00"/>
      <!-- gold-trimmed shaft -->
      <rect x="7"  y="12" width="2" height="10" fill="#a07020"/>
      <rect x="7"  y="12" width="1" height="10" fill="#c08840"/>
      <rect x="6"  y="14" width="4" height="1" fill="#fff8c0"/>
      <rect x="6"  y="20" width="4" height="2" fill="#fff8c0"/>
      <rect x="6"  y="20" width="4" height="1" fill="#ffe080"/>
    </symbol>
    <symbol id="ur-shield-mirror" viewBox="0 0 16 24">
      <!-- frame top -->
      <rect x="3"  y="2"  width="10" height="2"  fill="#c0c0d0"/>
      <rect x="2"  y="3"  width="12" height="13" fill="#c8c8d8"/>
      <rect x="2"  y="3"  width="12" height="2"  fill="#fff"/>
      <!-- mirror surface -->
      <rect x="4"  y="5"  width="8"  height="8"  fill="#a0d8f8"/>
      <rect x="4"  y="5"  width="8"  height="3"  fill="#c0e8ff"/>
      <rect x="5"  y="6"  width="2"  height="2"  fill="#fff"/>
      <rect x="9"  y="9"  width="2"  height="2"  fill="#fff"/>
      <!-- frame bottom curves -->
      <rect x="3"  y="13" width="10" height="3"  fill="#c0c0d0"/>
      <rect x="5"  y="16" width="6"  height="2"  fill="#a0a0b0"/>
      <rect x="6"  y="18" width="4"  height="1"  fill="#808090"/>
      <!-- frame edges -->
      <rect x="1"  y="3"  width="1"  height="13" fill="#606070"/>
      <rect x="14" y="3"  width="1"  height="13" fill="#606070"/>
      <!-- corner gems -->
      <rect x="2"  y="2"  width="2"  height="2"  fill="#ff80c0"/>
      <rect x="12" y="2"  width="2"  height="2"  fill="#ff80c0"/>
      <!-- handle -->
      <rect x="7"  y="20" width="2"  height="3"  fill="#a06030"/>
    </symbol>
  </defs>
</svg>

  <div id="app">
    <div id="game-wrap">
      <canvas id="game" width="480" height="400"></canvas>
      <div id="topbar">
        <div id="round-pill"><span id="round-num">1/4</span></div>
      </div>
      <div id="audio-toggle">
        <button id="btn-pause" class="audio-btn">⏸</button>
        <button id="btn-se" class="audio-btn">🔊</button>
        <button id="btn-bgm" class="audio-btn off">🎵</button>
      </div>
      <div id="chest-stack"></div>
    </div>

    <div id="hud">
      <div id="bars">
        <div class="hp-display">
          <span class="hp-label">HP</span>
          <span class="lv-pill">Lv <span id="lv-num">1</span></span>
          <span class="hp-number"><span id="hp-num">200</span><span class="hp-slash">/</span><span id="hp-max">200</span></span>
        </div>
        <div class="bar-row">
          <div class="bar hp-bar"><div id="hp-fill"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">AP</span>
          <div id="ap-segments"></div>
        </div>
      </div>

      <div id="combat-grid">
        <!-- Row 1: 4 equipment slots -->
        <div class="eq-slot rarity-common" data-slot="sword">
          <svg class="eq-icon"><use href="#ico-sword"/></svg>
          <span class="eq-plus">+0</span>
        </div>
        <div class="eq-slot rarity-common" data-slot="spear">
          <svg class="eq-icon"><use href="#ico-spear"/></svg>
          <span class="eq-plus">+0</span>
        </div>
        <div class="eq-slot rarity-common" data-slot="hammer">
          <svg class="eq-icon"><use href="#ico-hammer"/></svg>
          <span class="eq-plus">+0</span>
        </div>
        <div class="eq-slot rarity-common" data-slot="shield">
          <svg class="eq-icon"><use href="#ico-shield"/></svg>
          <span class="eq-plus">+0</span>
        </div>

        <!-- Row 2: Current move buttons + Guard -->
        <button class="current-btn" data-weapon="sword">
          <span class="ap-cost">2</span>
          <svg class="move-icon"><use href="#ico-sword"/></svg>
          <span class="cell-name">斬り上げ</span>
        </button>
        <button class="current-btn" data-weapon="spear">
          <span class="ap-cost">1</span>
          <svg class="move-icon"><use href="#ico-spear"/></svg>
          <span class="cell-name">シャベリン</span>
        </button>
        <button class="current-btn" data-weapon="hammer">
          <span class="ap-cost">2</span>
          <svg class="move-icon"><use href="#ico-hammer"/></svg>
          <span class="cell-name">ふっとばし</span>
        </button>
        <button id="shield" class="side-btn shield-btn">
          <span class="side-icon">🛡</span>
          <span class="side-label">ガード</span>
        </button>

        <!-- Row 3: NEXT previews + Meat -->
        <div class="next-cell" data-weapon="sword">
          <span class="next-tag">NEXT</span>
          <span class="next-ap">3</span>
          <svg class="next-icon"><use href="#ico-sword"/></svg>
          <span class="next-name">ブリ斬</span>
        </div>
        <div class="next-cell" data-weapon="spear">
          <span class="next-tag">NEXT</span>
          <span class="next-ap">2</span>
          <svg class="next-icon"><use href="#ico-spear"/></svg>
          <span class="next-name">キック</span>
        </div>
        <div class="next-cell" data-weapon="hammer">
          <span class="next-tag">NEXT</span>
          <span class="next-ap">3</span>
          <svg class="next-icon"><use href="#ico-hammer"/></svg>
          <span class="next-name">大地砕</span>
        </div>
        <button id="meat" class="side-btn meat-btn">
          <span class="side-icon">🍖</span>
          <span class="side-count" id="meat-count">×2</span>
        </button>
      </div>
    </div>

    <!-- ===== Main Menu ===== -->
    <div id="main-menu" class="screen hidden">
      <div class="menu-frame">
        <div class="menu-statusbar">
          <div class="status-left">
            <div class="status-rank">Lv <span id="status-rank-num">1</span></div>
          </div>
          <div class="status-right">
            <div class="status-coin">💰 <span id="status-coin">0</span></div>
          </div>
        </div>

        <div class="menu-canvas">
          <h1 class="menu-title">騎士ドラ風</h1>
          <p class="menu-sub">クリア済 <span id="menu-cleared">0</span> / <span id="menu-total">3</span> ステージ</p>
          <div class="menu-castle">
            <div class="castle-emoji">🏰</div>
            <div class="menu-hint">下のメニューから選択</div>
          </div>
        </div>

        <div class="menu-bar">
          <button class="menu-btn" data-menu="oshigoto">
            <div class="menu-icon">🏰</div>
            <div class="menu-label">おしごと</div>
          </button>
          <button class="menu-btn locked" data-menu="quest">
            <div class="menu-icon">⚔️</div>
            <div class="menu-label">クエスト</div>
            <div class="lock">🔒</div>
          </button>
          <button class="menu-btn" data-menu="souvi">
            <div class="menu-icon">🛡️</div>
            <div class="menu-label">そうび</div>
          </button>
          <button class="menu-btn locked" data-menu="friend">
            <div class="menu-icon">👻</div>
            <div class="menu-label">フレンド</div>
            <div class="lock">🔒</div>
          </button>
          <button class="menu-btn" data-menu="shop">
            <div class="menu-icon">🏪</div>
            <div class="menu-label">ショップ</div>
          </button>
          <button class="menu-btn locked" data-menu="treasure">
            <div class="menu-icon">📦</div>
            <div class="menu-label">お宝屋</div>
            <div class="lock">🔒</div>
          </button>
          <button class="menu-btn locked" data-menu="other">
            <div class="menu-icon">⋯</div>
            <div class="menu-label">その他</div>
            <div class="lock">🔒</div>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== Equipment Screen ===== -->
    <div id="equipment-screen" class="screen hidden">
      <div class="screen-inner">
        <h2 class="screen-title">そうび</h2>
        <p class="result-instruction">所持品をタップして装備変更／🔨で重複武器を強化</p>
        <div id="equipped-grid"></div>
        <h3 class="section-title">所持品</h3>
        <div id="inventory-list"></div>
        <button id="equipment-back" class="big-btn">メニューへ戻る</button>
      </div>
    </div>

    <!-- ===== Fusion Modal ===== -->
    <div id="fuse-screen" class="screen hidden">
      <div class="screen-inner">
        <h2 class="screen-title">重複武器を強化</h2>
        <p class="result-instruction">同じ種類の所持品を素材にして強化値を上げる</p>
        <div id="fuse-base"></div>
        <h3 class="section-title">素材を選択（タップで選択）</h3>
        <div id="fuse-materials"></div>
        <div class="fuse-summary">
          選択 <span id="fuse-count">0</span> 個 / 強化値 <span id="fuse-gain">+0</span>
        </div>
        <button id="fuse-confirm" class="big-btn">強化する</button>
        <button id="fuse-cancel" class="big-btn" style="background: linear-gradient(180deg, #6b4d2a 0%, #3a2410 100%); border-color: #8b6940; margin-top: 6px;">キャンセル</button>
      </div>
    </div>

    <!-- ===== Shop Screen ===== -->
    <div id="shop-screen" class="screen hidden">
      <div class="screen-inner">
        <h2 class="screen-title">ショップ</h2>
        <div class="shop-balance">所持金 <span class="gold-icon">💰</span> <span id="shop-gold">0</span></div>
        <div id="shop-list"></div>
        <button id="shop-back" class="big-btn">メニューへ戻る</button>
      </div>
    </div>

    <!-- ===== Stage Select Screen ===== -->
    <div id="stage-select" class="screen hidden">
      <div class="screen-inner">
        <h2 class="screen-title">おしごと</h2>
        <p class="result-instruction">ステージを選んで挑戦</p>
        <div id="stage-list"></div>
        <button id="stage-back" class="big-btn">メニューへ戻る</button>
      </div>
    </div>

    <!-- ===== Result Screen ===== -->
    <div id="result-screen" class="screen hidden">
      <div class="screen-inner">
        <h2 id="result-title" class="screen-title">STAGE CLEAR!</h2>
        <p id="result-stage-name"></p>
        <p class="result-instruction">宝箱をタップして開ける</p>
        <div id="chest-grid"></div>
        <button id="result-next" class="big-btn">メニューへ戻る</button>
      </div>
    </div>

    <!-- Defeat overlay still uses simple modal -->
    <div id="overlay" class="hidden">
      <div class="overlay-inner">
        <h1 id="overlay-title">DEFEAT</h1>
        <p id="overlay-text">騎士は倒れた...</p>
        <button id="restart">メニューへ戻る</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
