<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>騎士ドラ風 戦闘プロトタイプ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="game-wrap">
      <canvas id="game" width="480" height="600"></canvas>
      <div id="topbar">
        <div id="round-pill"><span id="round-num">1/4</span></div>
      </div>
      <div id="audio-toggle">
        <button id="btn-pause" class="audio-btn">⏸</button>
        <button id="btn-se" class="audio-btn">🔊</button>
        <button id="btn-bgm" class="audio-btn off">🎵</button>
      </div>
    </div>

    <div id="hud">
      <div id="bars">
        <div class="bar-row">
          <span class="bar-label">HP</span>
          <div class="bar hp-bar"><div id="hp-fill"></div><span id="hp-text">120/120</span></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">AP</span>
          <div id="ap-segments"></div>
        </div>
      </div>

      <div id="combat-grid">
        <!-- Equipment row (top) -->
        <div class="eq-slot rarity-r" data-slot="sword">
          <span class="eq-icon" data-icon="sword"></span>
          <span class="eq-name">剣</span>
          <span class="eq-plus">+1</span>
        </div>
        <div class="eq-slot rarity-sr" data-slot="spear">
          <span class="eq-icon" data-icon="spear"></span>
          <span class="eq-name">槍</span>
          <span class="eq-plus">+2</span>
        </div>
        <div class="eq-slot rarity-r" data-slot="hammer">
          <span class="eq-icon" data-icon="hammer"></span>
          <span class="eq-name">ハンマー</span>
          <span class="eq-plus">+1</span>
        </div>

        <!-- Move buttons (middle row) -->
        <button class="move-btn" data-weapon="sword">
          <div class="move-current">
            <span class="ap-cost">2</span>
            <span class="move-icon" data-icon="sword"></span>
            <span class="cur-name">斬り上げ</span>
          </div>
          <div class="move-next">
            <span class="next-label">NEXT</span>
            <span class="next-ap">3</span>
            <span class="next-icon" data-icon="sword"></span>
            <span class="next-name">ブリ斬</span>
          </div>
        </button>
        <button class="move-btn" data-weapon="spear">
          <div class="move-current">
            <span class="ap-cost">1</span>
            <span class="move-icon" data-icon="spear"></span>
            <span class="cur-name">シャベリン</span>
          </div>
          <div class="move-next">
            <span class="next-label">NEXT</span>
            <span class="next-ap">2</span>
            <span class="next-icon" data-icon="spear"></span>
            <span class="next-name">キック</span>
          </div>
        </button>
        <button class="move-btn" data-weapon="hammer">
          <div class="move-current">
            <span class="ap-cost">2</span>
            <span class="move-icon" data-icon="hammer"></span>
            <span class="cur-name">ふっとばし</span>
          </div>
          <div class="move-next">
            <span class="next-label">NEXT</span>
            <span class="next-ap">3</span>
            <span class="next-icon" data-icon="hammer"></span>
            <span class="next-name">大地砕</span>
          </div>
        </button>

        <!-- Side actions (right column, span both rows) -->
        <div class="action-side">
          <button id="shield" class="side-btn shield-btn">
            <span class="side-icon">🛡</span>
            <span class="side-label">ガード</span>
          </button>
          <button id="meat" class="side-btn meat-btn">
            <span class="side-icon">🍖</span>
            <span class="side-count" id="meat-count">×2</span>
          </button>
        </div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="overlay-inner">
        <h1 id="overlay-title">VICTORY</h1>
        <p id="overlay-text">敵を倒した！</p>
        <button id="restart">もう一度</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
