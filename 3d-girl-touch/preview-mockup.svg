<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#150a26"/>
    </radialGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7cff"/>
      <stop offset="100%" stop-color="#ff6fae"/>
    </linearGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a2a55"/>
      <stop offset="100%" stop-color="#2a1d44"/>
    </radialGradient>
  </defs>

  <!-- phone screen bg -->
  <rect width="390" height="780" rx="44" fill="url(#bg)"/>

  <!-- floor disc -->
  <ellipse cx="195" cy="600" rx="150" ry="42" fill="url(#floor)"/>
  <ellipse cx="195" cy="600" rx="92" ry="26" fill="none" stroke="#ff6fae" stroke-width="3" opacity="0.5"/>

  <!-- ===== character (chibi, twin tails, pink dress) ===== -->
  <g>
    <!-- shadow -->
    <ellipse cx="195" cy="598" rx="70" ry="16" fill="#000" opacity="0.25"/>

    <!-- twin tails (behind) -->
    <path d="M150 250 q-46 18 -40 78 q3 30 26 40 q-30 -36 -8 -76 q12 -22 22 -42z" fill="#5a3a2a"/>
    <path d="M240 250 q46 18 40 78 q-3 30 -26 40 q30 -36 8 -76 q-12 -22 -22 -42z" fill="#5a3a2a"/>

    <!-- legs -->
    <rect x="178" y="500" width="14" height="70" rx="7" fill="#ffe0c8"/>
    <rect x="198" y="500" width="14" height="70" rx="7" fill="#ffe0c8"/>
    <!-- shoes -->
    <ellipse cx="185" cy="575" rx="16" ry="11" fill="#6a4cff"/>
    <ellipse cx="205" cy="575" rx="16" ry="11" fill="#6a4cff"/>

    <!-- skirt -->
    <path d="M140 500 L195 380 L250 500 Z" fill="#ff7fb0"/>
    <ellipse cx="195" cy="500" rx="56" ry="12" fill="#ffffff"/>
    <!-- bodice -->
    <rect x="167" y="320" width="56" height="80" rx="26" fill="#ff7fb0"/>

    <!-- arms -->
    <rect x="138" y="330" width="16" height="78" rx="8" fill="#ffe0c8" transform="rotate(12 146 330)"/>
    <rect x="236" y="330" width="16" height="78" rx="8" fill="#ffe0c8" transform="rotate(-12 244 330)"/>
    <circle cx="135" cy="412" r="12" fill="#ffe0c8"/>
    <circle cx="255" cy="412" r="12" fill="#ffe0c8"/>

    <!-- neck -->
    <rect x="186" y="305" width="18" height="22" rx="6" fill="#ffe0c8"/>

    <!-- head -->
    <circle cx="195" cy="250" r="62" fill="#ffe0c8"/>
    <!-- hair back -->
    <path d="M133 250 a62 62 0 0 1 124 0 q0 -78 -62 -78 q-62 0 -62 78z" fill="#5a3a2a"/>
    <!-- bangs -->
    <path d="M134 232 q4 -56 61 -58 q57 2 61 58 q-30 -20 -61 -18 q-31 -2 -61 18z" fill="#5a3a2a"/>
    <!-- hair ties -->
    <circle cx="142" cy="206" r="9" fill="#ff7fb0"/>
    <circle cx="248" cy="206" r="9" fill="#ff7fb0"/>

    <!-- blush -->
    <ellipse cx="166" cy="262" rx="11" ry="7" fill="#ff8fae" opacity="0.7"/>
    <ellipse cx="224" cy="262" rx="11" ry="7" fill="#ff8fae" opacity="0.7"/>

    <!-- eyes -->
    <ellipse cx="172" cy="246" rx="11" ry="15" fill="#ffffff"/>
    <ellipse cx="218" cy="246" rx="11" ry="15" fill="#ffffff"/>
    <circle cx="173" cy="249" r="8" fill="#3a2a55"/>
    <circle cx="217" cy="249" r="8" fill="#3a2a55"/>
    <circle cx="176" cy="245" r="3" fill="#fff"/>
    <circle cx="220" cy="245" r="3" fill="#fff"/>

    <!-- smile -->
    <path d="M183 272 q12 12 24 0" fill="none" stroke="#c24a6a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- floating hearts -->
  <g fill="#ff6fae">
    <path d="M300 200 c-4-8 -16-6 -16 3 c0 8 16 16 16 16 c0 0 16-8 16-16 c0-9 -12-11 -16-3z" opacity="0.9"/>
    <path d="M92 300 c-3-6 -12-4 -12 2 c0 6 12 12 12 12 c0 0 12-6 12-12 c0-6 -9-8 -12-2z" opacity="0.7" fill="#8a7cff"/>
    <path d="M280 360 c-2-5 -10-4 -10 2 c0 5 10 10 10 10 c0 0 10-5 10-10 c0-6 -8-7 -10-2z" opacity="0.6"/>
  </g>

  <!-- ===== UI overlay ===== -->
  <!-- title -->
  <text x="195" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">ふれあい3Dガール</text>
  <text x="195" y="82" text-anchor="middle" fill="#fff" font-size="12" opacity="0.8">ドラッグで回転 / ピンチでズーム / タップでふれあい</text>

  <!-- affection meter -->
  <g>
    <text x="60" y="118" fill="#fff" font-size="12">なかよし度</text>
    <text x="330" y="118" text-anchor="end" fill="#fff" font-size="12">62%</text>
    <rect x="60" y="124" width="270" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
    <rect x="60" y="124" width="167" height="10" rx="5" fill="url(#meter)"/>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="108" y="628" width="174" height="40" rx="18" fill="#ffffff" opacity="0.96"/>
    <path d="M186 666 l9 10 l9 -10 z" fill="#ffffff" opacity="0.96"/>
    <text x="195" y="653" text-anchor="middle" fill="#3a2a45" font-size="15" font-weight="700">えへへ、なでてくれるの？</text>
  </g>

  <!-- control buttons -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="70" y="704" width="72" height="50" rx="14" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="106" y="726" font-size="18">👋</text><text x="106" y="744">あいさつ</text>
    <rect x="159" y="704" width="72" height="50" rx="14" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="195" y="726" font-size="18">💃</text><text x="195" y="744">ダンス</text>
    <rect x="248" y="704" width="72" height="50" rx="14" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="284" y="726" font-size="18">🔄</text><text x="284" y="744">視点</text>
  </g>
</svg>
